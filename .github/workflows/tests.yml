name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Run behavioral and API tests
        run: uv run --frozen --python "${{ matrix.python }}" python -m unittest discover -s tests -v
      - name: Check the complete CLI flow
        if: matrix.python == '3.12'
        run: |
          uv run --frozen tiny-nn build
          uv run --frozen tiny-nn dataset --split dev --per-case 2
          uv run --frozen tiny-nn dataset --split test --per-case 3 --exclude artifacts/data/dev
          uv run --frozen tiny-nn evaluate --data artifacts/data/test --output artifacts/reports/test
          uv build
