[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-nn"
version = "0.1.0"
description = "A visual neural network with weights constructed from geometry, without training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Otto Joseph"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13"]

[project.scripts]
tiny-nn = "tiny_nn.__main__:main"

[project.urls]
Repository = "https://github.com/ottobonilla95/tiny-nn"
Documentation = "https://github.com/ottobonilla95/tiny-nn#readme"
Issues = "https://github.com/ottobonilla95/tiny-nn/issues"

[tool.hatch.build.targets.wheel]
packages = ["tiny_nn"]
